# Integración continua de El Hogar del Hobbit (TK-002).
# En cada push a develop, main y ramas feature, y en cada pull request a develop y main: instala las dependencias,
# crea la base de datos de pruebas con los datos ficticios y pasa las pruebas.
# Si falla alguna prueba, el pipeline falla.

name: CI

on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
    branches: [develop, main]

jobs:
  pruebas:
    name: Pruebas automáticas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Proyecto/requirements.txt

      - name: Instalar dependencias
        run: "python -m pip install --only-binary=:all: -r requirements.txt"

      - name: Crear la base de datos de pruebas con datos ficticios
        run: python -m flask --app run init-db

      - name: Ejecutar las pruebas
        run: python -m pytest -v
