  name: SonarCloud
  on:
    push:
      branches: [ main ]
    pull_request:
      types: [ opened, synchronize, reopened ]
    workflow_dispatch:

  jobs:
    sonar:
      name: Build y análisis
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - name: Tests con cobertura
          working-directory: Proyecto
          run: |
            python -m pip install --only-binary=:all: --require-hashes -r requirements-lock.txt
            python -m flask --app run init-db
            python -m pytest --cov=app --cov-report=xml
        - name: Análisis SonarCloud
          uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}